name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned development dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and script syntax
        run: bash scripts/validate-repository.sh
      - name: Run lightweight checks
        run: make test
