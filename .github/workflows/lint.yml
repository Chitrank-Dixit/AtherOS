name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 '**/*.md' '.github/**/*.md'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python checkers
        run: python -m pip install ruff pyright yamllint check-jsonschema
      - name: Ruff
        run: ruff check scripts
      - name: Pyright
        run: pyright scripts
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
      - name: YAML validation
        run: yamllint .
      - name: JSON Schema validation
        run: check-jsonschema --schemafile schemas/experiment-record.schema.json tests/fixtures/experiment-record.json
